services:
 postgres:
  image: postgres:14.22-trixie
  container_name: cekemmy-postgres
  env_file: .env
  environment:
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: ${POSTGRES_DB}
  ports:
   - "${POSTGRES_PORT}:5432"
  volumes:
   - cekemmy_db_data:/var/lib/postgresql/data

 backend:
   image: cekemmy-backend:latest
   container_name: cekemmy-backend
   env_file: .env.docker
   ports:
   - "3000:3000"
   depends_on:
   - postgres


volumes:
 cekemmy_db_data: