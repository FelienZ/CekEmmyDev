services:
 postgres:
  image: postgres:14.22-trixie
  container_name: cekemmy-postgres
  env_file: .env
  environment:
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
   POSTGRES_DB: ${POSTGRES_DB}
  ports:
   - "${POSTGRES_PORT:-5432}:5432"
  volumes:
   - cekemmy_db_data:/var/lib/postgresql/data

volumes:
 cekemmy_db_data: